name: Binary cache

# Builds every profile and pushes the result to machine0.cachix.org, the
# cache every machine0 image already trusts (modules/core/nix.nix), so image
# builds and nightly upgrades download what would otherwise be compiled on
# the VM.
#
# Runs on pull requests as well as on main: an image rebuild starts on the
# push to main, so the cache has to be warm before the merge. A pull request
# from a fork gets no secret, so it builds and pushes nothing.
#
# Unfree packages are pushed only when nixpkgs marks their licence
# redistributable; ci/cache-push.sh decides and explains what is left out.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [base, loaded, gpu, openclaw, hermes]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # The openclaw and hermes closures unpack to more than 10 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://cache.garnix.io
            extra-trusted-public-keys = cache.garnix.io:CTFPyKSLcx5RMJKfLo5EEPUObbA78b0YQ2DTCJXqr9g=
      # Pull only: the action's own push would upload every path built,
      # with no licence check. ci/cache-push.sh does the push.
      - uses: cachix/cachix-action@v17
        with:
          name: machine0
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Build
        run: nix build --no-link --print-build-logs ".#nixosConfigurations.${{ matrix.profile }}.config.system.build.toplevel"
      - name: Push to the cache
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: ci/cache-push.sh "${{ matrix.profile }}"
